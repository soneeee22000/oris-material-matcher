# A68 §1 term map (DESIGN.md §6 arm C, §10.8). General domain vocabulary only, never BoQ item text.
# term: a phrase exactly as one library writes it in a type, usage or subtype label (whole phrase,
#   case-insensitive after the §6 normaliser); lang: the term's language (en | fr).
# equivalents: the other language's terms, plus abbreviations and standard designations.
# source is the provenance tag:
#   library   - a translation of the library's own vocabulary;
#   standard  - a designation fixed by a public norm, named in ref (required);
#   dev_error - a general fact added because dev error evidence showed the gap (still no item text).
# Entries are sorted by (lang, normalised term); keys are in the order term, lang, equivalents,
# source, ref. Reviewed before use: see data/enrichment/README.md.
