name: ci

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras --no-extra retrieval
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy --strict src
      - run: uv run mypy --strict eval/*.py scripts/*.py
        shell: bash
      - run: uv run pytest -m "not live" --cov=oris_matcher
      - run: uv run coverage report --include="src/oris_matcher/domain/*,src/oris_matcher/service.py" --fail-under=80
      - name: Clean-clone B0 run, RQ1-RQ5 only, no ground truth (G3-T19, §10.3)
        shell: bash
        run: |
          uv run oris --input tests/fixtures/cli/small_boq.csv --library data/oris_materials_global.csv --output "$RUNNER_TEMP/b0.csv" --profile b0 --run-dir "$RUNNER_TEMP/runs"
          uv run python eval/check_requirements.py --output "$RUNNER_TEMP/b0.csv" --input tests/fixtures/cli/small_boq.csv --library data/oris_materials_global.csv --reference "$RUNNER_TEMP/no-ground-truth.csv" --checks RQ1,RQ2,RQ3,RQ4,RQ5
      - name: RQ11, the lockbox outputs replay byte-identical at $0 (G4)
        shell: bash
        run: |
          uv run oris replay runs/submission/20261008T023928Z-56f85fb8 --check output/improved_output_en.csv
          uv run oris replay runs/submission/20261008T024244Z-de394c39 --check output/improved_output_fr.csv
      - name: Project page data is current
        shell: bash
        run: uv run python scripts/export_site_data.py --check

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Committed operator UI build is current, no file missing or extra (docs/ui-spec.md §2)
        shell: bash
        run: |
          test -z "$(git status --porcelain -- ../src/oris_matcher/api/static/ui)" || {
            git status --porcelain -- ../src/oris_matcher/api/static/ui
            git diff -- ../src/oris_matcher/api/static/ui
            exit 1
          }
      - run: npx playwright install --with-deps chromium
      - name: UI smoke, U4 marker, filter, XSS and labels in Chromium against a mocked API
        run: npm run smoke
