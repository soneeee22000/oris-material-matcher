[project]
name = "oris-matcher"
version = "0.0.1"
description = "Maps Bill of Quantities lines to an ORIS material library row, or decides not_a_material or needs_review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.11,<1.12",
    "openai>=3.24,<4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.18",
    "typer>=0.15",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1", "defusedxml>=0.7"]
eval = ["pandas>=2.2", "numpy>=2.0", "scipy>=1.14", "scikit-learn>=1.5", "matplotlib>=3.9"]
retrieval = ["sentence-transformers>=3.3", "rank-bm25>=0.2.2"]

[project.scripts]
oris = "oris_matcher.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.120",
    "pytest-socket>=0.7",
    "pytest-cov>=6.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oris_matcher"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "eval"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "N", "D"]
extend-select = ["PLW1514"]
ignore = ["D203", "D213", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--allow-hosts=127.0.0.1,::1"
markers = ["live: calls a paid model API; never run in CI"]

[tool.coverage.run]
source = ["oris_matcher"]
branch = true
